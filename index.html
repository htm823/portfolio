	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/style-en.css">
	<link rel="shortcut icon" href="../assets/img/favicon.ico" type="image/x-icon">
	<title>Hatsumi Shimizu | Web Development & Writing</title>
</head>

<body>
	<main>
		<div class="redirect">
			<div class="redirect__inner container">
				<p id="redirect-msg" class="redirect__msg">
					<span>P</span><span>a</span><span>g</span><span>e</span>&nbsp;
					<span>l</span><span>o</span><span>a</span><span>d</span><span>i</span><span>n</span><span>g</span>&nbsp;<span>.</span><span>.</span><span>.</span>
				</p>

				<!-- If JavaScript is disabled -->
				<noscript>
				<p class="redirect__en">
					JavaScript is disabled.<br>
					Click the following URL to manually access the site.<br><br>
					<i class="fa-solid fa-link"></i> <a href="/en/index.html" class="text-link">Portfolio Website of Hatsumi Shimizu</a>
				</p>
				<p class="redirect__jp">
					JavaScriptが有効になっていません。<br>
					下記URLから手動でサイトにアクセスしてください。<br><br>
					<i class="fa-solid fa-link"></i> <a href="/ja/index.html" class="text-link">Hatsumi Shimizuのポートフォリオサイト</a>
				</p>
				</noscript>
			</div>
		</div>
	</main>
	<script>
		'use strict';

		// Redirect based on browser language
		const lang = navigator.language || 'en_GB';

		const target = lang.startsWith('ja')
			? '/ja/index.html'
			: '/en/index.html';

		location.replace(target);
	</script>
</body>

</html>
